services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: dev-lib
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-seed:
    image: mongo:8.0
    environment:
      MONGODB_URI: mongodb://mongo:27017/dev-lib
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./db:/seed:ro
    command: ["sh", "/seed/seed.sh"]
    restart: "no"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/dev-lib
      CLIENT_ORIGIN: http://localhost:4200
    depends_on:
      mongo-seed:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        BUILD_CONFIGURATION: docker
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "4200:80"

volumes:
  mongo-data:
